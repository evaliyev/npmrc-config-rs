name: Upstream drift

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Check @npmcli/config parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check for upstream drift
        id: check
        run: |
          set +e
          node upstream/check.mjs > drift.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt

      - name: Open or update the drift issue
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('drift.txt', 'utf8')
            const pinned = fs.readFileSync('upstream/UPSTREAM_VERSION', 'utf8').trim()
            const title = `Upstream drift from @npmcli/config (pinned ${pinned})`
            const body = [
              'The deterministic parity check failed. Report:',
              '',
              '```',
              report.trim(),
              '```',
              '',
              'To reconcile, run `/upstream-sync` locally (or `just upstream-sync-bump`',
              'followed by a manual review of the diff).',
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift',
            })

            if (existing.length) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                title,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift'],
              })
            }
